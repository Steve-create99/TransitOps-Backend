# ── Application ───────────────────────────────────────────────
spring.application.name=transitops
server.port=8080

# ── Database (Neon PostgreSQL) ─────────────────────────────────
# Removed channel_binding=require — it is a libpq-only param, not valid in JDBC
spring.datasource.url=jdbc:postgresql://ep-hidden-king-aysc3vbc-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_uQbSWO1rqaY4
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP (connection pool tuning for Neon serverless) ─────
# Neon drops idle connections quickly; keep pool small and test before borrow
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Validates the connection is alive before handing it to JPA
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────
transitops.jwt.secret=dHJhbnNpdG9wcy1zdXBlci1zZWNyZXQta2V5LWFjY3JhLW1ldHJvLXRyYW5zaXQtYXV0aG9yaXR5LTIwMjY=

spring.application.name=transitops

# Default profile: h2 for local. On Railway set SPRING_PROFILES_ACTIVE=prod
# (or leave unset and rely on DATABASE_URL detection in ApplicationEnvironment).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

server.port=${PORT:8080}

# IMPORTANT: Do NOT bind Railway's DATABASE_URL (postgres://...) here.
# That value is not a JDBC URL and crashes Spring Boot auto-config.
# Use SPRING_DATASOURCE_* or JDBC_DATABASE_URL, or the DatabaseUrlConfig bean.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/transitops}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Dialect is profile-specific (see application-h2 / application-prod)

# ── JWT ───────────────────────────────────────────────────────
transitops.jwt.secret=${JWT_SECRET:dHJhbnNpdG9wcy1zdXBlci1zZWNyZXQta2V5LWFjY3JhLW1ldHJvLXRyYW5zaXQtYXV0aG9yaXR5LTIwMjY=}
transitops.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
transitops.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── CORS ──────────────────────────────────────────────────────
transitops.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ── Bootstrap admin ───────────────────────────────────────────
transitops.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@transitops.local}
transitops.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

spring.application.name=transitops
# Use `local` for Neon, `h2` for in-memory local fallback
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

server.port=${PORT:8080}

# ── Database (override via env on Railway) ────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/transitops}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────
transitops.jwt.secret=${JWT_SECRET:dHJhbnNpdG9wcy1zdXBlci1zZWNyZXQta2V5LWFjY3JhLW1ldHJvLXRyYW5zaXQtYXV0aG9yaXR5LTIwMjY=}
transitops.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
transitops.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── CORS ──────────────────────────────────────────────────────
transitops.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ── Bootstrap admin ───────────────────────────────────────────
transitops.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@transitops.local}
transitops.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

[build]
builder = "NIXPACKS"
# Cap Maven heap so Nixpacks builders do not OOM during annotation processing / package.
buildCommand = "MAVEN_OPTS='-Xmx768m -XX:+UseSerialGC' ./mvnw -DskipTests -B package"

[deploy]
# Cap runtime heap on Railway hobby memory; leave headroom for native/metaspace.
startCommand = "java -Xms128m -Xmx512m -XX:+UseSerialGC -jar target/backend-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
